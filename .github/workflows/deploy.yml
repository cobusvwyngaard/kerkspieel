name: Deploy dashboard

# The dashboard is static and its data is committed, so a deploy is just a
# file upload. Raw survey extracts are not in the repo, so the build steps
# do not run here -- regenerate data/../aggregates.json locally and commit
# it when a wave is refreshed.
on:
  push:
    branches: [claude/report-dashboard-design-rr4x9w, main]
    paths: ['web/public/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the dashboard has data to serve
        run: |
          test -s web/public/data/aggregates.json || {
            echo "::error::web/public/data/aggregates.json is missing or empty."
            echo "Regenerate it with scripts/build_aggregates.py and commit it."
            exit 1
          }

      - name: Check the Cloudflare secrets are set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "The token needs the Cloudflare Pages: Edit permission; the"
            echo "account id is in the Workers & Pages sidebar. See README.md."
            exit 1
          fi

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/public --project-name=kerkspieel
