# Config for Cloudflare's git-connected Worker deploy. Present at the repo
# root in case the project's "Root directory" build setting is blank; a
# matching copy lives in web/ in case it is set to "web" instead -- wrangler
# only reads the config in its actual working directory, so both locations
# are covered rather than guessing which one the dashboard is using.
name = "kerkspieel"
compatibility_date = "2026-09-01"

# worker/index.js decides which part of the site answers. It is the switch
# that currently leaves only the Opsomming entrance open; remove `main` and
# the two asset keys below it to serve everything again.
main = "worker/index.js"

[assets]
directory = "./web/public"
binding = "ASSETS"
# Without this the asset server answers before the worker ever runs, and
# the gate would never see a request for a page that exists.
run_worker_first = true
