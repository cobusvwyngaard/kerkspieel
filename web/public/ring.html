<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ringsverslag · Kerkspieël</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Kerkspieël Ringsverslag</h1>
  <p>Gemeentevraelys 2018, 2022 en 2026 · Taakspan Navorsing</p>
  <nav class="site-nav" id="site-nav" aria-label="Verslae"></nav>
</header>

<main>
  <div class="filters">
    <div class="field">
      <label for="synod">Sinode</label>
      <select id="synod"></select>
    </div>
    <div class="field">
      <label for="ring">Ring</label>
      <select id="ring"></select>
    </div>
    <div class="field field--wide">
      <label for="question">Vraag</label>
      <select id="question"></select>
    </div>
  </div>

  <section class="tiles" id="tiles"></section>

  <section class="panel">
    <h2 id="chart-title">—</h2>
    <p class="sub" id="chart-sub"></p>
    <div id="note-slot"></div>
    <div class="legend" id="legend"></div>
    <div class="scroller"><div id="chart"></div></div>
  </section>

  <section class="panel">
    <h2>Vergelyking</h2>
    <p class="sub">Persentasie van gemeentes wat elke opsie gekies het, per vlak en per jaar.</p>
    <div class="scroller"><table id="table"></table></div>
  </section>
</main>

<footer id="footer"></footer>
<div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>
<script src="common.js"></script>
<script src="ring.js"></script>
</body>
</html>
